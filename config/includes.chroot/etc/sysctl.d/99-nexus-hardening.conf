# Nexus OS 3000 - conservative kernel and network hardening defaults.
# Applied by systemd-sysctl when this image boots.
# These settings do not replace AppArmor, sandboxing, firewall policy or updates.

# Restrict exposure of kernel addresses and kernel logs.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Limit cross-process inspection between unrelated user processes.
kernel.yama.ptrace_scope = 1

# Disable unprivileged eBPF where supported by the running kernel.
kernel.unprivileged_bpf_disabled = 1

# Do not allow set-user-ID programs to produce privileged core dumps.
fs.suid_dumpable = 0

# Protect common temporary-directory and shared-directory file operations.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Ignore unauthenticated ICMP redirects and do not route packets by default.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
