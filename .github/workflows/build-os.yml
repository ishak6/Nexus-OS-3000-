name: Build Nexus OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/vm-smoke-test.sh"
      - "scripts/configure-live-bootloader.sh"
      - "lumen/**"
      - "pulse/**"
      - ".github/workflows/build-os.yml"

permissions:
  contents: read

concurrency:
  group: nexus-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build Debian-based live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Trixie live-build and ISO tooling
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://ftp-master.debian.org/keys/archive-key-13.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/debian-trixie.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/debian-trixie.gpg] http://deb.debian.org/debian trixie main" \
            | sudo tee /etc/apt/sources.list.d/debian-trixie.list >/dev/null
          cat <<'EOF' | sudo tee /etc/apt/preferences.d/debian-trixie >/dev/null
          Package: *
          Pin: release n=trixie
          Pin-Priority: 50

          Package: live-build
          Pin: release n=trixie
          Pin-Priority: 1001
          EOF
          install_build_tools() {
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
              live-build=1:20250505+deb13u1 \
              debootstrap squashfs-tools xorriso \
              grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
              isolinux syslinux-common syslinux-utils ca-certificates \
              debian-archive-keyring \
              cmake ninja-build qt6-base-dev qt6-declarative-dev \
              qml6-module-qtquick qml6-module-qtquick-controls \
              qml6-module-qtquick-layouts qml6-module-qtquick-window \
              qml6-module-qtqml-workerscript qml6-module-qtquick-templates
          }
          installed=0
          for attempt in 1 2 3; do
            if install_build_tools; then
              installed=1
              break
            fi
            echo "APT/network attempt $attempt failed; retrying after 20 seconds..." >&2
            sleep 20
          done
          if [ "$installed" -ne 1 ]; then
            echo "Could not install ISO build dependencies after 3 attempts." >&2
            exit 1
          fi
          lb --version
          command -v xorriso
          command -v isohybrid
          isohybrid --version

      - name: Configure Debian Trixie Live
        run: |
          # This image selects GRUB for BIOS and UEFI; ISOLINUX settings do not
          # control the boot menu shown by this image.
          bash scripts/configure-live-bootloader.sh \
            /usr/share/live/build/bootloaders/grub-pc \
            config/bootloaders/grub-pc
          mkdir -p config/archives
          cat > config/archives/nexus-security.list.chroot <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          cat > config/archives/nexus-security.list.binary <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          # Keep live-build's default linux-image handling enabled. Setting
          # --linux-packages none disables the kernel staging step and leaves
          # the generated GRUB entries pointing at files absent from /live.
          sudo lb config \
            --mode debian \
            --distribution trixie \
            --initramfs live-boot \
            --initsystem systemd \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloaders "grub-pc grub-efi" \
            --debian-installer false \
            --apt-recommends false \
            --apt-secure true \
            --security false \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --memtest none

      - name: Build and stage Nexus LUMEN application
        run: |
          set -euo pipefail
          cmake -S lumen -B build/lumen -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/lumen --parallel 2
          DESTDIR="$PWD/config/includes.chroot" cmake --install build/lumen --prefix /usr
          test -x config/includes.chroot/usr/bin/nexus-lumen
          test -s config/includes.chroot/usr/lib/nexus/pulse/telemetry.py
          test -s config/includes.chroot/usr/share/applications/nexus-lumen.desktop

      - name: Verify live-config runtime packages
        run: bash scripts/tests/test-live-config-packages.sh

      - name: Build ISO
        run: |
          set -euo pipefail
          sudo lb build 2>&1 | tee build.log

      - name: Verify generated GRUB kernel and initrd files
        run: bash scripts/verify-live-kernel-staging.sh binary

      - name: Verify generated GRUB timeout
        run: |
          set -euo pipefail
          grub_config="binary/boot/grub/config.cfg"
          test -s "$grub_config"
          grep -Fx 'set timeout_style=menu' "$grub_config"
          grep -Fx 'set timeout=5' "$grub_config"

      - name: Verify ISO boot entries and generate checksum
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=( *.iso )
          if [ "${#images[@]}" -eq 0 ]; then
            echo "No ISO image was produced." >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            test -s "$image"
            report="$(xorriso -indev "$image" -report_el_torito plain -report_system_area plain 2>&1)"
            printf '%s\n' "$report"
            if ! grep -Eqi 'BIOS' <<<"$report"; then
              echo "ISO is missing a legacy BIOS El Torito boot entry." >&2
              exit 1
            fi
            if ! grep -Eqi 'UEFI' <<<"$report"; then
              echo "ISO is missing a UEFI El Torito boot entry." >&2
              exit 1
            fi
            sha256sum "$image" | tee "$image.sha256"
          done
          sudo chown -R "$USER":"$USER" .

      - name: Extract effective GRUB configuration from ISO
        run: |
          set -euo pipefail
          image="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$image" ]; then
            echo "No ISO available for GRUB configuration extraction." >&2
            exit 1
          fi
          mkdir -p grub-boot-evidence
          xorriso -osirrox on -indev "$image" \
            -extract /boot/grub/config.cfg grub-boot-evidence/config.cfg
          xorriso -osirrox on -indev "$image" \
            -extract /boot/grub/grub.cfg grub-boot-evidence/grub.cfg
          test -s grub-boot-evidence/config.cfg
          test -s grub-boot-evidence/grub.cfg
          grep -Fxq 'set timeout_style=menu' grub-boot-evidence/config.cfg
          grep -Fxq 'set timeout=5' grub-boot-evidence/config.cfg
          grep -Fxq 'source /boot/grub/config.cfg' grub-boot-evidence/grub.cfg
          if ! grep -Eq '^[[:space:]]*linux[[:space:]].*boot=live components([[:space:]]|$)' grub-boot-evidence/grub.cfg; then
            echo "ISO GRUB entries must activate live-config with boot=live components." >&2
            exit 1
          fi
          echo "=== /boot/grub/config.cfg extracted from the ISO ==="
          cat grub-boot-evidence/config.cfg
          echo "=== /boot/grub/grub.cfg extracted from the ISO ==="
          cat grub-boot-evidence/grub.cfg
          sha256sum grub-boot-evidence/*

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-3000-iso
          path: |
            *.iso
            *.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload effective GRUB configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-grub-boot-evidence
          path: grub-boot-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-build-logs
          path: |
            build.log
            *.log
            config/
          if-no-files-found: ignore
          retention-days: 7

  vm-boot-smoke:
    name: Boot live ISO in isolated QEMU VM
    needs: build-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-os-3000-iso
          path: dist

      - name: Install QEMU and OCR tools
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 tesseract-ocr

      - name: Boot ISO and capture desktop evidence
        run: |
          set -euo pipefail
          image="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$image" ]; then
            echo "Downloaded artifact does not contain an ISO." >&2
            exit 1
          fi
          bash scripts/vm-smoke-test.sh "$image" vm-smoke-evidence

      - name: Upload VM boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-vm-smoke-evidence
          path: vm-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
