name: Build Nexus OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/build-os.yml"

permissions:
  contents: read

concurrency:
  group: nexus-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build Debian-based live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Trixie live-build and ISO tooling
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://ftp-master.debian.org/keys/archive-key-13.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/debian-trixie.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/debian-trixie.gpg] http://deb.debian.org/debian trixie main" \
            | sudo tee /etc/apt/sources.list.d/debian-trixie.list >/dev/null
          cat <<'EOF' | sudo tee /etc/apt/preferences.d/debian-trixie >/dev/null
          Package: *
          Pin: release n=trixie
          Pin-Priority: 50

          Package: live-build
          Pin: release n=trixie
          Pin-Priority: 1001
          EOF
          install_build_tools() {
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \\
              live-build=1:20250505+deb13u1 \\
              debootstrap squashfs-tools xorriso \\
              grub-pc-bin grub-efi-amd64-bin mtools dosfstools \\
              isolinux syslinux-common syslinux-utils ca-certificates \\
              debian-archive-keyring
          }
          installed=0
          for attempt in 1 2 3; do
            if install_build_tools; then
              installed=1
              break
            fi
            echo "APT/network attempt $attempt failed; retrying after 20 seconds..." >&2
            sleep 20
          done
          if [ "$installed" -ne 1 ]; then
            echo "Could not install ISO build dependencies after 3 attempts." >&2
            exit 1
          fi
          lb --version
          command -v xorriso
          command -v isohybrid
          isohybrid --version

      - name: Configure Debian Trixie Live
        run: |
          mkdir -p config/archives
          cat > config/archives/nexus-security.list.chroot <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          cat > config/archives/nexus-security.list.binary <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          sudo lb config \
            --mode debian \
            --distribution trixie \
            --initramfs live-boot \
            --initsystem systemd \
            --architectures amd64 \
            --linux-packages none \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloaders "grub-pc grub-efi" \
            --debian-installer false \
            --apt-recommends false \
            --apt-secure true \
            --security false \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --memtest none

      - name: Build ISO
        run: |
          set -euo pipefail
          sudo lb build 2>&1 | tee build.log

      - name: Verify ISO boot entries and generate checksum
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=( *.iso )
          if [ "${#images[@]}" -eq 0 ]; then
            echo "No ISO image was produced." >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            test -s "$image"
            report="$(xorriso -indev "$image" -report_el_torito plain -report_system_area plain 2>&1)"
            printf '%s\n' "$report"
            if ! grep -Eqi 'BIOS' <<<"$report"; then
              echo "ISO is missing a legacy BIOS El Torito boot entry." >&2
              exit 1
            fi
            if ! grep -Eqi 'UEFI' <<<"$report"; then
              echo "ISO is missing a UEFI El Torito boot entry." >&2
              exit 1
            fi
            sha256sum "$image" | tee "$image.sha256"
          done
          sudo chown -R "$USER":"$USER" .

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-3000-iso
          path: |
            *.iso
            *.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-build-logs
          path: |
            build.log
            *.log
            config/
          if-no-files-found: ignore
          retention-days: 7
