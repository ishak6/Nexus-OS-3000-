name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace errors
        run: git diff --check
      - name: Validate required project files
        run: |
          set -euo pipefail
          test -s README.md
          test -s config/package-lists/nexus.list.chroot
          test -s harness/policy/manifest.schema.json
          test -s harness/policy/default-policy.json
          grep -q "name: Build Nexus OS ISO" .github/workflows/build-os.yml
          grep -q "distribution trixie" .github/workflows/build-os.yml
      - name: Validate Harness manifest and policy tests
        run: |
          set -euo pipefail
          python3 harness/policy/validate_manifest.py harness/examples/hello-app.manifest.json
          python3 -m unittest discover -s harness/tests -v
      - name: Report source tree
        run: |
          echo "Tracked project files:"
          git ls-files
