name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check commit whitespace
        run: git show --check --oneline HEAD
      - name: Validate repository structure and policy JSON
        run: |
          set -euo pipefail
          test -s README.md
          test -s config/package-lists/nexus.list.chroot
          test -s harness/policy/manifest.schema.json
          test -s harness/policy/default-policy.json
          test -s harness/inspection/inspect_archive.py
          test -s scripts/security-audit.sh
          test -s lumen/CMakeLists.txt
          test -s lumen/main.cpp
          test -s lumen/qml/Main.qml
          test -s pulse/telemetry.py
          test -s docs/LUMEN_IMPLEMENTATION.md
          grep -q "name: Build Nexus OS ISO" .github/workflows/build-os.yml
          grep -q "distribution trixie" .github/workflows/build-os.yml
          grep -q -- 'live-build=1:20250505+deb13u1' .github/workflows/build-os.yml
          grep -q 'Pin-Priority: 50' .github/workflows/build-os.yml
          grep -q 'Pin-Priority: 1001' .github/workflows/build-os.yml
          grep -q -- '--bootloaders "grub-pc grub-efi"' .github/workflows/build-os.yml
          grep -q "report_el_torito plain" .github/workflows/build-os.yml
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-os.yml")
          for number, line in enumerate(workflow.read_text().splitlines(), 1):
              trailing = len(line) - len(line.rstrip("\\"))
              if trailing > 1:
                  raise SystemExit(
                      f"{workflow}:{number}: doubled trailing backslash breaks shell continuation"
                  )
          PY
          python3 -m json.tool harness/policy/manifest.schema.json >/dev/null
          python3 -m json.tool harness/policy/default-policy.json >/dev/null
          python3 -m json.tool harness/examples/hello-app.manifest.json >/dev/null
      - name: Python syntax and Harness test suite
        run: |
          set -euo pipefail
          python3 -m compileall -q harness
          python3 harness/policy/validate_manifest.py harness/examples/hello-app.manifest.json
          python3 -m unittest discover -s harness/tests -v
          python3 -m unittest discover -s pulse/tests -v
      - name: Validate diagnostic shell script syntax
        run: bash -n scripts/security-audit.sh
      - name: Install Qt 6 build and QML runtime dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake ninja-build qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window
      - name: Build LUMEN prototype
        run: |
          set -euo pipefail
          cmake -S lumen -B build/lumen -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/lumen --parallel 2
      - name: LUMEN offscreen startup smoke test
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8s ./build/lumen/nexus-lumen
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            echo "LUMEN did not remain running during the 8-second smoke test (exit: $result)." >&2
            exit 1
          fi
      - name: Report source tree
        run: git ls-files
