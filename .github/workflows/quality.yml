name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check commit whitespace
        run: git show --check --oneline HEAD
      - name: Validate repository structure and policy JSON
        run: |
          set -euo pipefail
          test -s README.md
          test -s config/package-lists/nexus.list.chroot
          test -s harness/policy/manifest.schema.json
          test -s harness/policy/default-policy.json
          test -s harness/inspection/inspect_archive.py
          test -s scripts/security-audit.sh
          grep -q "name: Build Nexus OS ISO" .github/workflows/build-os.yml
          grep -q "distribution trixie" .github/workflows/build-os.yml
          grep -q -- 'live-build=1:20250505+deb13u1' .github/workflows/build-os.yml
          grep -q 'Pin-Priority: 50' .github/workflows/build-os.yml
          grep -q 'Pin-Priority: 1001' .github/workflows/build-os.yml
          grep -q -- '--bootloaders "grub-pc grub-efi"' .github/workflows/build-os.yml
          grep -q "report_el_torito plain" .github/workflows/build-os.yml
          python3 -m json.tool harness/policy/manifest.schema.json >/dev/null
          python3 -m json.tool harness/policy/default-policy.json >/dev/null
          python3 -m json.tool harness/examples/hello-app.manifest.json >/dev/null
      - name: Python syntax and Harness test suite
        run: |
          set -euo pipefail
          python3 -m compileall -q harness
          python3 harness/policy/validate_manifest.py harness/examples/hello-app.manifest.json
          python3 -m unittest discover -s harness/tests -v
      - name: Validate diagnostic shell script syntax
        run: bash -n scripts/security-audit.sh
      - name: Report source tree
        run: git ls-files
